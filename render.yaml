# Blueprint do Render (plano gratuito). Passo a passo em docs/implantacao.md.
#
# DATABASE_URL: cole a connection string de um PostgreSQL gratuito do Neon (neon.tech).
# Se ficar em branco, a aplicação usa um SQLite temporário, repopulado a cada reinício.
services:
  - type: web
    name: rastro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # o grafo vive em memória: um único processo
    startCommand: uvicorn rastro.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: RASTRO_SEED_SE_VAZIO
        value: "300"
