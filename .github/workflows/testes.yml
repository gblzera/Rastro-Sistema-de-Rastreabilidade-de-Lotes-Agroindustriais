name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 é o Python que vem com as ferramentas de linha de comando do macOS
        python-version: ["3.9", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rastro
          POSTGRES_PASSWORD: rastro
          POSTGRES_DB: rastro_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rastro"
          --health-interval 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes (SQLite e PostgreSQL)
        env:
          RASTRO_TEST_POSTGRES_URL: postgresql://rastro:rastro@localhost:5432/rastro_teste
        run: python -m pytest
      - name: Prova de conceito no terminal
        run: python -m rastro demo --lotes 300
