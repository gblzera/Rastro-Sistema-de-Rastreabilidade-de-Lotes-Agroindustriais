[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro"
version = "0.3.0"
description = "Rastro — Sistema de Rastreabilidade de Lotes Agroindustriais (DAG dinâmico)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gabriel Henrique Kuhn Paz" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rastro = "rastro.cli:main"

[tool.setuptools.packages.find]
include = ["rastro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
